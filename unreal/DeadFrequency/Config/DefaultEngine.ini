; DEAD FREQUENCY - engine configuration (Unreal Engine 5.8)

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/DeadFrequency.DFGameMode
GameInstanceClass=/Script/DeadFrequency.DFGameInstance

[/Script/Engine.Engine]
GameUserSettingsClassName=/Script/DeadFrequency.DFGameUserSettings

[/Script/Engine.RendererSettings]
; Lumen global illumination and reflections, Nanite, virtual shadow maps; no baked lighting anywhere
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.AllowStaticLighting=False
; hardware ray tracing is available on RTX cards (Epic/Cinematic presets switch Lumen to it); software Lumen otherwise
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=False
; Temporal Super Resolution; DLSS/FSR/XeSS come from their vendor plugins
r.AntiAliasingMethod=4
; horror needs controlled exposure: areas set it in post-process volumes
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
; custom depth with stencil: the cloaked Listener is revealed on 107.9 MHz through a stencil pass
r.CustomDepth=3

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
